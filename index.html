<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Final Project</title>
	<link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
	<section>
<div class="main">
	<div class="left">
		<h3>Gem: <span class="gem-cost">500</span></h3>
			<img src="./assets/img/gem2.jpg" alt="" srcset="" class="gem-image" onclick="incrementGem()" draggable="false">
		</div>
	<div class="right">

		<div class="upgrade" onclick="buyClicker()">
			<div class="left-section">
				<img src="./assets/img/clicker-white.webp" alt="" class="upgrade-img">
			</div>
			<div class="mid-section">
				<h4>Clicker</h4>
				<div class="cost-info">
					<p>Cost: <span class="clicker-cost">10</span></p>
					<img src="./assets/img/gem2.jpg" alt="" class="gem-img">
				</div>
			</div>
			<div class="right-section">Level <span class="clicker-level">0</span></div>

			<div class="next-level-info">
				<p>
					+<span class="clicker-increase">1</span> gems <br/> per click
				</p>
			</div>
		</div>

		<div class="upgrade" onclick="buyPickaxe()">
			<div class="left-section">
				<img src="./assets/img/pickaxe.png" alt="" class="upgrade-img">
			</div>
			<div class="mid-section">
				<h4>Pickaxe</h4>
				<div class="cost-info">
					<p>Cost: <span class="pickaxe-cost">130</span></p>
					<img src="./assets/img/gem2.jpg" alt="" class="gem-img">
				</div>
			</div>
			<div class="right-section">Level <span class="pickaxe-level">0</span></div>

			<div class="next-level-info">
				<p>
					+<span class="pickaxe-increase">4</span> gems <br/> per second
				</p>
			</div>
		</div>

		<div class="upgrade" onclick="buyMiner()">
			<div class="left-section">
				<img src="./assets/img/miner.jpg" alt="" class="upgrade-img">
			</div>
			<div class="mid-section">
				<h4>Miner</h4>
				<div class="cost-info">
					<p>Cost: <span class="miner-cost">850</span></p>
					<img src="./assets/img/gem2.jpg" alt="" class="gem-img">
				</div>
			</div>
			<div class="right-section">Level <span class="miner-level">0</span></div>

			<div class="next-level-info">
				<p>
					+<span class="miner-increase">12</span> gems <br/> per second
				</p>
			</div>
		</div>

	</div>
</div>

<div class="statistics">
	<div class="texts">
		<p>GPC: <span id="gpc-text">1</span></p>
		<p>GPS: <span id="gps-text">0</span></p>
</div>
</div>
	</section>
	<script src="./assets/js/main.js"></script>
</body>
</html>
